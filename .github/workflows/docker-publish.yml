name: Docker Publish (CUDA 13.2 + Julia 1.12)

on:
  push:
    branches:
      - main

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Docker Image
    # Runs on a disposable GitHub-hosted VM, not the self-hosted GPU runner.
    # Building a CUDA image needs no GPU, and this job is the one place in the
    # repo that holds `packages: write` plus a registry credential at the same
    # time as `Pkg.instantiate()` (Dockerfile:57), which can execute build
    # scripts from the general Julia registry. On the shared self-hosted host —
    # one OS user, no per-job isolation, several other repositories' runner
    # credentials on disk — that combination put the token AND those other
    # credentials within reach of any compromised dependency.
    #
    # To be precise about what moving here does and does not fix: the job's
    # GITHUB_TOKEN is still present on the VM while the build runs, and
    # Pkg.instantiate() still executes third-party registry code alongside it.
    # What goes away is cross-repository credential reach and host persistence
    # — the exposure is confined to this job's lifetime, and no other
    # repository's credentials are reachable from it.
    runs-on: ubuntu-latest
    if: github.repository == 'rmems/Surrogate_Viz.jl'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Required for `cache-to: type=gha` below — the hosted runner's default
      # builder uses the "docker" driver, which cannot export a cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set Docker tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$IMAGE:${{ github.sha }},$IMAGE:main"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=13.2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
