name: Docker Build (CUDA 13.2 + Julia 1.12)
on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# SECURITY: Restrict top-level permissions to read-only.
permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Required for `cache-to: type=gha` below. The default builder on a
      # GitHub-hosted runner uses the "docker" driver, which cannot export a
      # cache ("Cache export is not supported for the docker driver"). This
      # action provisions a docker-container driver, which can. The previous
      # self-hosted runner happened to have such a builder already configured.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set Docker tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$IMAGE:${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS,$IMAGE:main"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="$TAGS,$IMAGE:pr-${{ github.event.number }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build Docker Image (No Push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=13.2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

# This workflow handles PR-time Docker verification only. Publishing lives in
# `.github/workflows/docker-publish.yml` so PRs do not show an intentionally
# skipped publish job.
#
# Runs on ubuntu-latest, not the self-hosted GPU runner. `docker build` does
# execute the image's RUN instructions — including Julia and Pkg.instantiate()
# (Dockerfile:49,57) — but none of that needs a GPU: Dockerfile:49 explicitly
# tolerates nvidia-smi being absent. Keeping this off the self-hosted box means
# only jobs that genuinely need the RTX 5080 (test, gpu-preflight, cuda-visuals
# in julia.yml) run on a host shared with several other repositories' runners.
