name: Julia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SECURITY: default to read-only. cuda-visuals + gpu-preflight tighten further.
permissions:
  contents: read

jobs:
  test-cpu:
    # CPU-only job. This is the one that runs locally on your machine
    # (`julia --project=. -e 'using Pkg; Pkg.test()'`) and on GitHub-hosted
    # ubuntu-latest. It must stay reliable, is not gated on the self-hosted
    # GPU runner, and also covers fork PRs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: "1.12"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  test:
    # Runs on self-hosted GPU runner for full test coverage including CUDA tests
    runs-on: [self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Resolve packages into a per-repository depot rather than the runner
      # account's shared ~/.julia. That account hosts several repositories'
      # runners, so a tampered package resolved by any one of them would
      # otherwise persist in the shared depot for every later job on this host.
      # See .github/RUNNER.md for the full trust boundary.
      #
      # Sited one level ABOVE the checkout on purpose. actions/checkout defaults
      # to clean: true, which runs `git clean -ffdx` — and -x deletes ignored
      # files, which a depot inside the checkout would be. Putting it in the
      # parent keeps it out of checkout's reach, so it survives between runs of
      # this repo while staying isolated from every other repo on the host.
      #
      # Written as `github.workspace/..` rather than `runner.workspace`, which
      # names that directory directly but is NOT available in a job-level env
      # block: using it made the whole workflow fail to parse (the run showed up
      # as ".github/workflows/julia.yml: failure" with no jobs at all, rather
      # than as "Julia CI"). The github context is available here.
      JULIA_DEPOT_PATH: ${{ github.workspace }}/../julia_depot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Instantiate with CUDA
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add("CUDA")'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  # ---------------------------------------------------------------------------
  # GPU preflight + CUDA / GPU job for the pure-Julia CUDA visual kernels.
  # ---------------------------------------------------------------------------

  gpu-preflight:
    name: GPU/Docker preflight (host + container nvidia-smi)
    runs-on: [self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]
    # SECURITY (Grok Build 0.1 model)
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Host GPU/Docker preflight
        run: |
          set -eux
          whoami
          id
          groups
          DOCKER_BIN="$(command -v docker || true)"
          if [ -z "$DOCKER_BIN" ] && [ -x /usr/bin/docker ]; then
            DOCKER_BIN=/usr/bin/docker
          fi
          [ -n "$DOCKER_BIN" ]
          "$DOCKER_BIN" version
          "$DOCKER_BIN" info | sed -n '1,80p'
          command -v nvidia-smi || true
          nvidia-smi || true
          echo "=== basic nvidia/cuda image (no --gpus, for pull test) ==="
          # Grok Build 0.1 model: try a couple of known-good tags; the one that
          # produces nvidia-smi output is the one that works with the toolkit on
          # this host. 13.2.0 matches corinth-canal style; 12.8.1 was the prior
          # default for sm_120.
          "$DOCKER_BIN" run --rm nvidia/cuda:13.2.0-devel-ubuntu22.04 nvidia-smi || true
          "$DOCKER_BIN" run --rm nvidia/cuda:12.8.1-devel-ubuntu22.04 nvidia-smi || true
          echo "=== with --gpus all (this must succeed or cuda-visuals will fail) ==="
          # Check for the primary tag - if GPU passthrough doesn't work, print prominent warning + host setup instructions (from the big comment below), but do not fail the job.
          # This way preflight always "passes" (for visibility), but logs clearly show if setup is needed.
          # Note: corinth-canal Docker GPU actions often succeed because their inner docker runs are for *build* (nvcc + headers are inside the devel image; no host GPU passthrough required for compilation).
          # This preflight + cuda-visuals test *runtime* passthrough so CUDA.jl can execute kernels on the host RTX 5080 from inside the container.
          echo "=== Exact manual repro command (the one you said failed) ==="
          "$DOCKER_BIN" run --rm --gpus all nvidia/cuda:13.2.0-devel-ubuntu22.04 nvidia-smi 2>&1 | tee /tmp/gpu_13_2.log || echo "Command for 13.2 exited non-zero (see output above)"
          echo "=== Same for 12.8.1 tag ==="
          "$DOCKER_BIN" run --rm --gpus all nvidia/cuda:12.8.1-devel-ubuntu22.04 nvidia-smi 2>&1 | tee /tmp/gpu_12_8.log || echo "Command for 12.8 exited non-zero (see output above)"
          echo "=== Trying with explicit --runtime=nvidia (some setups need this) ==="
          "$DOCKER_BIN" run --rm --gpus all --runtime=nvidia nvidia/cuda:13.2.0-devel-ubuntu22.04 nvidia-smi 2>&1 | tee /tmp/gpu_runtime.log || echo "With --runtime=nvidia exited non-zero"
          if ! cat /tmp/gpu_13_2.log /tmp/gpu_12_8.log /tmp/gpu_runtime.log | grep -q 'NVIDIA\|GeForce\|RTX'; then
            echo "!!! GPU passthrough check FAILED (no NVIDIA device visible in any of the above runs)."
            echo "See the full outputs in /tmp/gpu_*.log above."
            echo "Check the host setup instructions in the comment below this step (usermod docker group + nvidia-ctk + restart docker + restart Listener as that user)."
            echo "Compare the whoami/groups here vs when you ran the docker command manually."
            echo "If corinth-canal actions work but this fails: corinth mostly does build inside docker (no --gpus needed); here we need runtime device passthrough for CUDA execution."
          else
            echo "GPU passthrough OK for at least one image tag / runtime."
          fi
          echo "=== id / groups / docker socket for the runner user (often the cause of 'docker failed on actions-runner terminal') ==="
          id -u; id -g; groups; ls -l /var/run/docker.sock || true
          echo "=== df and /app permissions (volume mount from the runner checkout) ==="
          df -h /tmp /app || true; ls -ld /app || true
          echo "=== Docker runtime info ==="
          "$DOCKER_BIN" info 2>/dev/null | grep -E 'Runtimes:|Default Runtime:|nvidia|Server Version' || true
          echo "=== nvidia-container-cli binary search (for 'nvidia-container-cli binary path could not be found' error) ==="
          find /usr -name '*nvidia-container-cli*' 2>/dev/null | head -5 || echo "No nvidia-container-cli under /usr"
          command -v nvidia-container-cli || echo "nvidia-container-cli not in current PATH"
          sudo command -v nvidia-container-cli 2>/dev/null || echo "nvidia-container-cli not in root PATH (check sudo which)"
          echo "=== /etc/docker/daemon.json content ==="
          cat /etc/docker/daemon.json 2>/dev/null || echo "No /etc/docker/daemon.json or not readable"
          echo "=== nvidia-container-runtime config (if present) ==="
          cat /etc/nvidia-container-runtime/config.toml 2>/dev/null || echo "No config.toml"
          echo "=== Full docker info runtimes (json) ==="
          "$DOCKER_BIN" info --format '{{json .Runtimes}}' 2>/dev/null | cat || echo "Could not get runtimes json"
          echo "=== ls for nvidia container binaries ==="
          ls -l /usr/bin/nvidia-container* /usr/local/bin/nvidia-container* /usr/libexec/nvidia-container* 2>/dev/null || echo "No nvidia-container* binaries in common bin dirs"

# ------------------------------------------------------------------------------------
# Grok Build 0.1 model + host setup (the piece "GPT-5.4 mini could not fix" because it
# is out-of-band for the runner user).
#
# If the --gpus lines above (or the ones inside cuda-visuals) fail with permission,
# "could not select device driver", or the container nvidia-smi is empty, the
# actions-runner Listener user on the 5080 host does not have a working docker +
# nvidia-container-toolkit setup.
#
# Specific error "nvidia-container-cli binary path could not be found":
# This means the NVIDIA runtime hook (used by --gpus all) cannot locate the
# nvidia-container-cli binary when setting up the container.
#
# Troubleshooting steps (run these and compare output to a working corinth-canal job):
# 1. Find the binary: find /usr -name '*nvidia-container-cli*' 2>/dev/null
#    (Common location: /usr/bin/nvidia-container-cli)
# 2. Re-run configure: sudo nvidia-ctk runtime configure --runtime=docker
#    (If binary is in non-standard place, you may need to reinstall the toolkit package
#     or manually set the path in /etc/nvidia-container-runtime/config.toml under [nvidia-container-cli])
# 3. Check daemon config: cat /etc/docker/daemon.json 2>/dev/null
#    Look for "nvidia" runtime with "path": "/usr/bin/nvidia-container-runtime"
# 4. Docker info: docker info | grep -E 'Runtimes:|Default Runtime:|nvidia'
# 5. Reinstall if needed: sudo apt-get install --reinstall nvidia-container-toolkit nvidia-container-toolkit-base
# 6. Always: sudo systemctl restart docker
# 7. Restart the Listener *after* all of the above as the target user.
#
# Why "I should be already working" / "Docker actions works in corinth-canal":
# corinth-canal's GPU jobs (e.g. in gpu-tests.yml) primarily use docker run for
# *compilation* inside the devel image (nvcc and CUDA headers live inside the container;
# host GPU passthrough is not required for build steps). This preflight + the
# cuda-visuals script explicitly test *runtime* device passthrough (--gpus all) so
# that pure-Julia CUDA.jl can execute kernels on the host RTX 5080 *from inside*
# the container. The nvidia-container-toolkit + proper --gpus (or --runtime=nvidia)
# is mandatory for the runtime case.
#
# ONE-TIME COMMANDS (run as the user that executes ~/actions-runner/run.sh, or
# with sudo for the usermod/ctk steps, then switch to that user for the Listener):
#
#   sudo usermod -aG docker $USER
#   # log out / in or `newgrp docker` or start a fresh shell for the group to take
#   sudo nvidia-ctk runtime configure --runtime=docker
#   sudo systemctl restart docker
#
#   # verify from a *new* shell for that exact user
#   docker run --rm --gpus all nvidia/cuda:13.2.0-devel-ubuntu22.04 nvidia-smi
#
#   # then (re)start the listener in that shell / as that user
#   cd ~/actions-runner
#   ./run.sh   # or nohup ./run.sh &
#
# After the "docker" label update you did in Settings, the workflows declare the
# full label set. The runner must be (re)started *after* the group + toolkit steps.
#
# Manual repro you can copy-paste on the 5080 host (after the above setup) to
# prove the exact command the cuda-visuals step will run:
#
#   git clone --branch feat/og-png-data-cuda-visuals-sm120-runner-grok-build-0.1 \
#       https://github.com/rmems/Surrogate_Viz.jl.git /tmp/sviz-ci-repro
#   cd /tmp/sviz-ci-repro
#   bash .github/scripts/run_cuda_visuals.sh
#
# It should print the "Pure-Julia CUDA visual kernel test passed" line and the
# device/cap for your RTX 5080.
# ------------------------------------------------------------------------------------

  cuda-visuals:
    name: CUDA visual kernels (pure Julia CUDA.jl + synthetic data)
    runs-on: [self-hosted, Linux, X64, gpu, sm120, julia-cuda, docker]
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run CUDA + Julia 1.12 visual kernel tests inside pinned nvidia/cuda container
        run: |
          # Make sure the script is executable (in case git checkout didn't preserve mode)
          chmod +x .github/scripts/run_cuda_visuals.sh || true
          bash .github/scripts/run_cuda_visuals.sh
